plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'idea'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

def google_api_key

// Release signing. Values come from keystore.properties in the repository root (git-ignored)
// or, as a fallback, from MEE_* environment variables, so no secret lives in the repository.
// Without them the release build stays unsigned instead of failing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingStorePath = keystoreProperties.getProperty("storeFile") ?: System.getenv("MEE_STORE_FILE")
def signingStorePassword = keystoreProperties.getProperty("storePassword") ?: System.getenv("MEE_STORE_PASSWORD")
def signingKeyAlias = keystoreProperties.getProperty("keyAlias") ?: System.getenv("MEE_KEY_ALIAS")
def signingKeyPassword = keystoreProperties.getProperty("keyPassword") ?: System.getenv("MEE_KEY_PASSWORD")
def hasReleaseSigning = signingStorePath != null && signingStorePassword != null &&
        signingKeyAlias != null && file(signingStorePath).exists()

android {
    namespace 'foundation.mee.android_client'
    compileSdk 36
    defaultConfig {
        applicationId "foundation.mee.android_client"
        minSdk 23
        targetSdk 36
        versionCode 29
        versionName "1.0.4"
        ndk {
            // Only ABIs we actually ship a native library for; must stay in sync with cargo.targets below.
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword ?: signingStorePassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties not found: the release build will be UNSIGNED")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            google_api_key = "1043231896197-4rn1v1fkg4jla06ugvdcgaol4lsoeu47"
            buildConfigField("String", "GOOGLE_API_KEY", "\"$google_api_key\"")
            manifestPlaceholders = [google_api_key: google_api_key]
        }
        debug {
            google_api_key = "1043231896197-sqo1jitbu0ed7e3h69oi3rbe9a0g4uqf"
            buildConfigField("String", "GOOGLE_API_KEY", "\"$google_api_key\"")
            manifestPlaceholders = [google_api_key: google_api_key]
        }
    }
    ndkVersion "25.2.9519653"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        // AGP 8 no longer generates BuildConfig unless asked; buildConfigField above needs it.
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // Uncompressed native libs, required for 16 KB page size support.
            useLegacyPackaging false
        }
    }
}

apply plugin: 'org.mozilla.rust-android-gradle.rust-android'

cargo {
    module = "../mee-core"       // Or whatever directory contains your Cargo.toml
    libname = "uniffi_mee_agent"          // Or whatever matches Cargo.toml's [package] name.
    targets = ["arm64", "arm", "x86_64"]  // Must stay in sync with android.defaultConfig.ndk.abiFilters
    targetDirectory = "../mee-core/target"
    apiLevel = 23
    // Release profile keeps the shipped .so small (a debug-profile libuniffi_mee_agent.so is
    // ~50 MB per ABI). Applies to every variant; pass -PrustProfile=debug for faster local
    // iteration on the Rust side.
    profile = (project.findProperty("rustProfile") ?: "release")
    // macOS has no bare "python"; set it here so the build does not depend on
    // the RUST_ANDROID_GRADLE_PYTHON_COMMAND environment variable being exported.
    pythonCommand = "python3"
    exec { spec, toolchain ->
        spec.environment("RANLIB", "${android.ndkDirectory}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ranlib")
        // 16 KB page alignment: mandatory for apps targeting API 35+, done automatically by NDK r28+.
        spec.environment("RUSTFLAGS", "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384")
        spec.environment("GOOGLE_API_CLIENT_ID", "${google_api_key}.apps.googleusercontent.com")
        spec.environment("GOOGLE_API_REDIRECT_URI", "com.googleusercontent.apps.${google_api_key}:/oauth2redirect")
    }
}

dependencies {

    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material"
    implementation 'androidx.compose.material3:material3'
    implementation "net.java.dev.jna:jna:5.19.1@aar"
    implementation("io.coil-kt:coil-compose:2.7.0")
    implementation("io.coil-kt:coil-svg:2.7.0")
    implementation "androidx.navigation:navigation-compose:2.9.8"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.3.0"
    implementation("androidx.biometric:biometric:1.1.0")
    implementation("androidx.datastore:datastore-preferences:1.1.7")
    // Deliberately pinned: bumping this changes the at-rest format of the wallet's encrypted prefs.
    implementation("androidx.security:security-crypto:1.0.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
    implementation('com.intuit.fuzzymatcher:fuzzy-matcher:1.1.0')
    implementation("com.squareup.moshi:moshi-kotlin:1.15.2")
    implementation("com.android.installreferrer:installreferrer:2.2")
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

tasks.whenTaskAdded { task ->
    if ((task.name == 'mergeDebugJniLibFolders' || task.name == 'mergeReleaseJniLibFolders')) {
        task.dependsOn 'cargoBuild'
    }
}

android.applicationVariants.all { variant ->
    def t = tasks.register("generate${variant.name.capitalize()}UniFFIBindings", Exec) {
        workingDir '../mee-core'
        // Runs the bindings generation, note that you must have uniffi-bindgen installed and in your PATH environment variable
        commandLine 'cargo', 'run', '--bin', 'mee_uniffi_bindgen', 'generate', "${rootDir}/mee-core/mee_agent/src/mee_agent.udl", '--language', 'kotlin', '--out-dir', "${buildDir}/generated/source/uniffi/${variant.name}/java"
    }
    variant.javaCompileProvider.get().dependsOn(t)
    def sourceSet = variant.sourceSets.find { it.name == variant.name }
    sourceSet.java.srcDir new File(buildDir, "generated/source/uniffi/${variant.name}/java")
    // XXX: I've been trying to make this work but I can't, so the compiled bindings will show as "regular sources" in Android Studio.
    idea.module.generatedSourceDirs += file("${buildDir}/generated/source/uniffi/${variant.name}/java/uniffi")
}

kapt {
    correctErrorTypes = true
}

// the lines below are needed to build com.intuit.fuzzymatcher:fuzzy-matcher for android < 26
allprojects {
    configurations.configureEach {
        resolutionStrategy.force 'org.apache.lucene:lucene-analyzers-common:4.8.1'
        resolutionStrategy.force 'org.apache.lucene:lucene-core:4.8.1'
    }
}
